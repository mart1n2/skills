name: contract-security-audit compatibility

on:
  push:
    branches: [main]
    paths:
      - "audit/contract-security-audit/**"
      - ".github/workflows/contract-security-audit-compat.yml"
  pull_request:
    paths:
      - "audit/contract-security-audit/**"
      - ".github/workflows/contract-security-audit-compat.yml"

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bash portability smoke suite
        shell: bash
        run: bash audit/contract-security-audit/scripts/test-skill.sh
      - name: zsh invocation smoke (macOS)
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: bash audit/contract-security-audit/scripts/test-skill.sh
